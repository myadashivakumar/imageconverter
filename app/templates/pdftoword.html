<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to Word</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    padding: 32px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: var(--text);
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: #eef2ff;
  }
  .dropzone svg { width: 36px; height: 36px; color: var(--accent); margin-bottom: 8px; }
  .dropzone-text { color: var(--text); font-weight: 600; font-size: 14px; }
  .dropzone-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  input[type="file"] { display: none; }

  .file-summary {
    display: none;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .file-summary.visible { display: block; }

  .preview-list {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    max-height: 220px;
    overflow-y: auto;
  }
  .preview-list.visible { display: flex; }
  .preview-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    transition: opacity 0.15s;
  }
  .preview-item.dragging { opacity: 0.4; }
  .drag-handle {
    color: var(--muted);
    cursor: grab;
    flex-shrink: 0;
    display: flex;
  }
  .drag-handle svg { width: 16px; height: 16px; }
  .preview-index {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #eef2ff;
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pdf-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 6px;
    background: #fee2e2;
    color: #dc2626;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pdf-icon svg { width: 20px; height: 20px; }
  .preview-info { flex: 1; min-width: 0; }
  .preview-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview-size { font-size: 12px; color: var(--muted); }
  .remove-btn {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
  }
  .remove-btn:hover { color: var(--danger); }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.visible { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 13px;
  }
  .error.visible { display: block; }

  .result {
    display: none;
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .result.visible { display: block; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--success);
    font-weight: 600;
    font-size: 14px;
  }
  .result-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #f8fafc;
  }
  .result-card .doc-icon {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #dbeafe;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .result-card .doc-icon svg { width: 24px; height: 24px; }
  .result-card-name { font-weight: 600; color: var(--text); font-size: 14px; }
  .result-card-size { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .result-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  a.download-btn, button.secondary {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  a.download-btn {
    background: var(--success);
    color: #fff;
  }
  a.download-btn:hover { opacity: 0.9; }
  button.secondary {
    background: #f1f5f9;
    color: var(--text);
  }
  button.secondary:hover { background: #e2e8f0; }

  .control-group { margin-top: 16px; }
  .control-label { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 4px; }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
    background: #fff;
  }
  .filename-group { margin-bottom: 14px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 16px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <a class="back-link" href="/">&larr; All tools</a>
    <h1>PDF to Word</h1>
    <p class="subtitle">Convert PDFs into editable Word documents. Select more than one and you'll get a ZIP back.</p>

    <form id="upload-form">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <div class="dropzone-text">Click to choose PDFs, or drag them here</div>
        <div class="dropzone-hint">Select multiple to convert them all at once</div>
        <input type="file" name="files" id="file_input" accept="application/pdf,.pdf" multiple>
      </div>

      <div class="file-summary" id="file-summary"></div>
      <div class="preview-list" id="preview-list"></div>

      <button type="submit" class="primary" id="convert-btn" disabled>
        <span class="spinner" id="spinner"></span>
        <span id="convert-label">Convert to Word</span>
      </button>
    </form>

    <div class="error" id="error-box"></div>

    <div class="result" id="result">
      <div class="result-header" id="result-header">&#10003; Converted successfully</div>
      <div class="result-card">
        <div class="doc-icon" id="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div>
          <div class="result-card-name" id="result-card-name">document.docx</div>
          <div class="result-card-size" id="result-card-size"></div>
        </div>
      </div>
      <div class="control-group filename-group">
        <span class="control-label">File name</span>
        <input type="text" id="filename-input" spellcheck="false">
      </div>
      <div class="result-actions">
        <a class="download-btn" id="download-link" download>Download</a>
        <button type="button" class="secondary" id="reset-btn">Convert another</button>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file_input');
    const fileSummary = document.getElementById('file-summary');
    const previewList = document.getElementById('preview-list');
    const form = document.getElementById('upload-form');
    const convertBtn = document.getElementById('convert-btn');
    const spinner = document.getElementById('spinner');
    const convertLabel = document.getElementById('convert-label');
    const errorBox = document.getElementById('error-box');
    const result = document.getElementById('result');
    const resultHeader = document.getElementById('result-header');
    const resultCardName = document.getElementById('result-card-name');
    const resultCardSize = document.getElementById('result-card-size');
    const filenameInput = document.getElementById('filename-input');
    const downloadLink = document.getElementById('download-link');
    const resetBtn = document.getElementById('reset-btn');

    let selectedFiles = [];
    let dragFromIndex = null;
    let resultExt = '.docx';

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function renderPreviewList() {
      previewList.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.draggable = true;
        item.dataset.index = index;

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.setAttribute('aria-label', 'Drag to reorder');
        handle.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>';

        const badge = document.createElement('span');
        badge.className = 'preview-index';
        badge.textContent = index + 1;

        const icon = document.createElement('div');
        icon.className = 'pdf-icon';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

        const info = document.createElement('div');
        info.className = 'preview-info';
        const name = document.createElement('div');
        name.className = 'preview-name';
        name.textContent = file.name;
        const size = document.createElement('div');
        size.className = 'preview-size';
        size.textContent = formatSize(file.size);
        info.append(name, size);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', 'Remove ' + file.name);
        removeBtn.innerHTML = '&times;';
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedFiles.splice(index, 1);
          renderPreviewList();
        });

        item.append(handle, badge, icon, info, removeBtn);
        previewList.appendChild(item);
      });

      previewList.classList.toggle('visible', selectedFiles.length > 0);
      convertBtn.disabled = selectedFiles.length === 0;

      if (selectedFiles.length === 0) {
        fileSummary.classList.remove('visible');
      } else if (selectedFiles.length === 1) {
        fileSummary.textContent = '1 PDF selected';
        fileSummary.classList.add('visible');
      } else {
        fileSummary.textContent = `${selectedFiles.length} PDFs selected — drag to reorder; you'll get a ZIP with one .docx per file`;
        fileSummary.classList.add('visible');
      }
    }

    previewList.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.preview-item');
      if (!item) return;
      dragFromIndex = Number(item.dataset.index);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    previewList.addEventListener('dragend', (e) => {
      const item = e.target.closest('.preview-item');
      if (item) item.classList.remove('dragging');
      dragFromIndex = null;
    });

    previewList.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    previewList.addEventListener('drop', (e) => {
      e.preventDefault();
      const targetItem = e.target.closest('.preview-item');
      if (!targetItem || dragFromIndex === null) return;
      const toIndex = Number(targetItem.dataset.index);
      if (toIndex === dragFromIndex) return;
      const [moved] = selectedFiles.splice(dragFromIndex, 1);
      selectedFiles.splice(toIndex, 0, moved);
      dragFromIndex = null;
      renderPreviewList();
    });

    function addFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      clearError();
      result.classList.remove('visible');
      selectedFiles = selectedFiles.concat(Array.from(fileList));
      renderPreviewList();
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      })
    );
    ['dragleave', 'drop'].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      })
    );
    dropzone.addEventListener('drop', (e) => {
      addFiles(e.dataTransfer.files);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedFiles.length === 0) return;

      clearError();
      convertBtn.disabled = true;
      spinner.classList.add('visible');
      convertLabel.textContent = 'Converting...';

      try {
        const formData = new FormData();
        selectedFiles.forEach((file) => formData.append('files', file));

        const response = await fetch(form.action, { method: 'POST', body: formData });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Conversion failed');
        }

        downloadLink.href = data.file_url;
        const defaultName = data.download_name || (data.is_zip ? 'documents.zip' : 'document.docx');
        resultExt = data.is_zip ? '.zip' : '.docx';
        const dot = defaultName.lastIndexOf('.');
        filenameInput.value = dot > 0 ? defaultName.slice(0, dot) : defaultName;
        downloadLink.setAttribute('download', defaultName);

        resultHeader.textContent = data.is_zip
          ? `✓ Converted ${data.file_count} PDFs to Word`
          : '✓ Converted successfully';
        resultCardName.textContent = defaultName;
        resultCardSize.textContent = formatSize(data.output_size) + (data.is_zip ? ` · ${data.file_count} files` : '');

        result.classList.add('visible');
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
      } finally {
        convertBtn.disabled = selectedFiles.length === 0;
        spinner.classList.remove('visible');
        convertLabel.textContent = 'Convert to Word';
      }
    });

    filenameInput.addEventListener('input', () => {
      const name = filenameInput.value.trim() || 'document';
      const fullName = name + resultExt;
      downloadLink.setAttribute('download', fullName);
      resultCardName.textContent = fullName;
    });

    resetBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      renderPreviewList();
      result.classList.remove('visible');
      clearError();
    });
  </script>
</body>
</html>
