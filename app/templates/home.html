<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to PDF Converter</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Img2PDF">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    padding: 32px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: var(--text);
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: #eef2ff;
  }
  .dropzone svg { width: 36px; height: 36px; color: var(--accent); margin-bottom: 8px; }
  .dropzone-text { color: var(--text); font-weight: 600; font-size: 14px; }
  .dropzone-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  input[type="file"] { display: none; }

  .file-summary {
    display: none;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .file-summary.visible { display: block; }

  .preview-list {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    max-height: 220px;
    overflow-y: auto;
  }
  .preview-list.visible { display: flex; }
  .preview-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .preview-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f1f5f9;
    flex-shrink: 0;
  }
  .preview-info { flex: 1; min-width: 0; }
  .preview-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview-size { font-size: 12px; color: var(--muted); }
  .remove-btn {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
  }
  .remove-btn:hover { color: var(--danger); }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.visible { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 13px;
  }
  .error.visible { display: block; }

  .result {
    display: none;
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .result.visible { display: block; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--success);
    font-weight: 600;
    font-size: 14px;
  }
  .pdf-preview {
    width: 100%;
    height: 360px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #f8fafc;
  }
  .result-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  a.download-btn, button.secondary {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  a.download-btn {
    background: var(--success);
    color: #fff;
  }
  a.download-btn:hover { opacity: 0.9; }
  button.secondary {
    background: #f1f5f9;
    color: var(--text);
  }
  button.secondary:hover { background: #e2e8f0; }

  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .install-btn {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .install-btn.visible { display: inline-flex; }
  .install-btn:hover { background: #eef2ff; }
  .install-btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <div>
        <h1>Image to PDF Converter</h1>
        <p class="subtitle">Upload one or more photos and get back a downloadable PDF.</p>
      </div>
      <button type="button" class="install-btn" id="install-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M12 15l-4-4M12 15l4-4"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        Install app
      </button>
    </div>

    <form id="upload-form">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <div class="dropzone-text">Click to choose images, or drag them here</div>
        <div class="dropzone-hint">JPG, PNG, GIF, BMP, WEBP, TIFF &middot; select multiple to combine into one PDF</div>
        <input type="file" name="files" id="file_photo" accept="image/*" multiple>
      </div>

      <div class="file-summary" id="file-summary"></div>
      <div class="preview-list" id="preview-list"></div>

      <button type="submit" class="primary" id="convert-btn" disabled>
        <span class="spinner" id="spinner"></span>
        <span id="convert-label">Convert to PDF</span>
      </button>
    </form>

    <div class="error" id="error-box"></div>

    <div class="result" id="result">
      <div class="result-header" id="result-header">&#10003; Converted successfully</div>
      <iframe class="pdf-preview" id="pdf-preview" title="PDF preview"></iframe>
      <div class="result-actions">
        <a class="download-btn" id="download-link" download>Download PDF</a>
        <button type="button" class="secondary" id="reset-btn">Convert another</button>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file_photo');
    const fileSummary = document.getElementById('file-summary');
    const previewList = document.getElementById('preview-list');
    const form = document.getElementById('upload-form');
    const convertBtn = document.getElementById('convert-btn');
    const spinner = document.getElementById('spinner');
    const convertLabel = document.getElementById('convert-label');
    const errorBox = document.getElementById('error-box');
    const result = document.getElementById('result');
    const resultHeader = document.getElementById('result-header');
    const pdfPreview = document.getElementById('pdf-preview');
    const downloadLink = document.getElementById('download-link');
    const resetBtn = document.getElementById('reset-btn');

    let selectedFiles = [];

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function renderPreviewList() {
      previewList.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        img.alt = '';
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.readAsDataURL(file);

        const info = document.createElement('div');
        info.className = 'preview-info';
        const name = document.createElement('div');
        name.className = 'preview-name';
        name.textContent = file.name;
        const size = document.createElement('div');
        size.className = 'preview-size';
        size.textContent = formatSize(file.size);
        info.append(name, size);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', 'Remove ' + file.name);
        removeBtn.innerHTML = '&times;';
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedFiles.splice(index, 1);
          renderPreviewList();
        });

        item.append(img, info, removeBtn);
        previewList.appendChild(item);
      });

      previewList.classList.toggle('visible', selectedFiles.length > 0);
      convertBtn.disabled = selectedFiles.length === 0;

      if (selectedFiles.length === 0) {
        fileSummary.classList.remove('visible');
      } else {
        fileSummary.textContent = selectedFiles.length === 1
          ? '1 image selected'
          : `${selectedFiles.length} images selected — will merge into one PDF, in this order`;
        fileSummary.classList.add('visible');
      }
    }

    function addFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      clearError();
      result.classList.remove('visible');
      selectedFiles = selectedFiles.concat(Array.from(fileList));
      renderPreviewList();
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      })
    );
    ['dragleave', 'drop'].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      })
    );
    dropzone.addEventListener('drop', (e) => {
      addFiles(e.dataTransfer.files);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedFiles.length === 0) return;

      clearError();
      convertBtn.disabled = true;
      spinner.classList.add('visible');
      convertLabel.textContent = 'Converting...';

      try {
        const formData = new FormData();
        selectedFiles.forEach((file) => formData.append('files', file));

        const response = await fetch(form.action, { method: 'POST', body: formData });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Conversion failed');
        }

        pdfPreview.src = data.pdf_url;
        downloadLink.href = data.pdf_url;
        downloadLink.setAttribute('download', data.download_name || 'converted.pdf');
        resultHeader.textContent = data.page_count > 1
          ? `✓ Converted ${data.page_count} images into one PDF`
          : '✓ Converted successfully';
        result.classList.add('visible');
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
      } finally {
        convertBtn.disabled = selectedFiles.length === 0;
        spinner.classList.remove('visible');
        convertLabel.textContent = 'Convert to PDF';
      }
    });

    resetBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      renderPreviewList();
      result.classList.remove('visible');
      pdfPreview.src = '';
      clearError();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
      });
    }

    const installBtn = document.getElementById('install-btn');
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.classList.add('visible');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.classList.remove('visible');
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.remove('visible');
    });
  </script>
</body>
</html>
