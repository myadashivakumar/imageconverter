<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge PDFs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <a class="back-link" href="index.html">&larr; All tools</a>
    <h1>Merge PDFs</h1>
    <p class="subtitle">Combine two or more PDFs into a single downloadable file.</p>

    <form id="upload-form">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <div class="dropzone-text">Click to choose PDFs, or drag them here</div>
        <div class="dropzone-hint">Select at least 2 PDFs to merge</div>
        <input type="file" name="files" id="file_input" accept="application/pdf,.pdf" multiple>
      </div>

      <div class="file-summary" id="file-summary"></div>
      <div class="preview-list" id="preview-list"></div>

      <div class="control-group">
        <span class="control-label">Page size</span>
        <select id="page-size">
          <option value="original" selected>Keep original sizes (recommended)</option>
          <option value="a4">A4</option>
          <option value="letter">US Letter</option>
          <option value="legal">Legal</option>
        </select>
        <div class="control-hint">If you pick a fixed size, each page is scaled to fit, centered.</div>
      </div>

      <button type="submit" class="primary" id="convert-btn" disabled>
        <span class="spinner" id="spinner"></span>
        <span id="convert-label">Merge PDFs</span>
      </button>
    </form>

    <div class="error" id="error-box"></div>

    <div class="result" id="result">
      <div class="result-header" id="result-header">&#10003; Merged successfully</div>
      <div class="result-stats" id="result-stats"></div>
      <iframe class="pdf-preview" id="pdf-preview" title="PDF preview"></iframe>
      <div class="control-group filename-group">
        <span class="control-label">File name</span>
        <input type="text" id="filename-input" spellcheck="false">
      </div>
      <div class="result-actions">
        <a class="download-btn" id="download-link" download>Download PDF</a>
        <button type="button" class="secondary" id="reset-btn">Merge another</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file_input');
    const fileSummary = document.getElementById('file-summary');
    const previewList = document.getElementById('preview-list');
    const pageSizeSelect = document.getElementById('page-size');
    const form = document.getElementById('upload-form');
    const convertBtn = document.getElementById('convert-btn');
    const spinner = document.getElementById('spinner');
    const convertLabel = document.getElementById('convert-label');
    const errorBox = document.getElementById('error-box');
    const result = document.getElementById('result');
    const resultHeader = document.getElementById('result-header');
    const resultStats = document.getElementById('result-stats');
    const pdfPreview = document.getElementById('pdf-preview');
    const filenameInput = document.getElementById('filename-input');
    const downloadLink = document.getElementById('download-link');
    const resetBtn = document.getElementById('reset-btn');

    let selectedFiles = [];

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function renderPdfIcon() {
      const icon = document.createElement('div');
      icon.className = 'pdf-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
      return icon;
    }

    function setFiles(next) {
      selectedFiles = next;
      renderReorderableList(previewList, selectedFiles, renderPdfIcon, setFiles);

      previewList.classList.toggle('visible', selectedFiles.length > 0);
      convertBtn.disabled = selectedFiles.length < 2;

      if (selectedFiles.length === 0) {
        fileSummary.classList.remove('visible');
      } else if (selectedFiles.length === 1) {
        fileSummary.textContent = '1 PDF selected — add at least one more to merge';
        fileSummary.classList.add('visible');
      } else {
        fileSummary.textContent = `${selectedFiles.length} PDFs selected — use the arrows to reorder; will merge in this order`;
        fileSummary.classList.add('visible');
      }
    }

    function addFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      clearError();
      result.classList.remove('visible');
      setFiles(selectedFiles.concat(Array.from(fileList)));
    }

    wireDropzone(dropzone, fileInput, addFiles);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedFiles.length < 2) return;

      clearError();
      convertBtn.disabled = true;
      spinner.classList.add('visible');
      convertLabel.textContent = 'Merging...';

      try {
        const formData = new FormData();
        selectedFiles.forEach((file) => formData.append('files', file));
        formData.append('page_size', pageSizeSelect.value);

        const response = await fetch(`${API_BASE}/mergepdf/upload/`, { method: 'POST', body: formData });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Merge failed');
        }

        const dataUri = dataUriFrom(data);
        pdfPreview.src = dataUri;
        downloadLink.href = dataUri;
        const defaultName = data.download_name || 'merged.pdf';
        filenameInput.value = defaultName.replace(/\.pdf$/i, '');
        downloadLink.setAttribute('download', defaultName);
        resultHeader.textContent = '✓ Merged successfully';
        resultStats.innerHTML = `<strong>${data.page_count}</strong> page${data.page_count > 1 ? 's' : ''} &middot; <strong>${formatSize(data.output_size)}</strong>`;
        result.classList.add('visible');
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
      } finally {
        convertBtn.disabled = selectedFiles.length < 2;
        spinner.classList.remove('visible');
        convertLabel.textContent = 'Merge PDFs';
      }
    });

    filenameInput.addEventListener('input', () => {
      const name = filenameInput.value.trim() || 'merged';
      downloadLink.setAttribute('download', name.replace(/\.pdf$/i, '') + '.pdf');
    });

    resetBtn.addEventListener('click', () => {
      setFiles([]);
      result.classList.remove('visible');
      pdfPreview.src = '';
      clearError();
    });
  </script>
</body>
</html>
